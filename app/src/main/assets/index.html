<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NK Music Box</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    .song-card { background: #1e1e1e; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .song-title { font-weight: bold; font-size: 16px; }
    .song-artist { font-size: 13px; color: #aaa; }
    .btn-dinle { background: linear-gradient(135deg, #9D4EDD, #FFB703); color: #121212; font-weight: bold; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-spotify, .btn-youtube { background: #282828; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; margin-left: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>NK Music Box</h2>

  <div id="song-list">
    <!-- Örnek Şarkı Kartı -->
    <div class="song-card">
      <div>
        <div class="song-title">Mehtaba Bak</div>
        <div class="song-artist">Zeki Müren</div>
      </div>
      <div>
        <button class="btn-dinle" onclick="sarkiCal('Zeki Müren', 'Mehtaba Bak')">▶ DİNLE</button>
        <button class="btn-spotify" onclick="sarkiCal('Zeki Müren', 'Mehtaba Bak')">Spotify</button>
        <button class="btn-youtube" onclick="sarkiCal('Zeki Müren', 'Mehtaba Bak')">YouTube</button>
      </div>
    </div>
  </div>

  <script>
    function sarkiCal(sanatci, sarki) {
      if (window.AndroidInterface && window.AndroidInterface.playSong) {
        window.AndroidInterface.playSong(sanatci, sarki, "", "");
      } else {
        const query = encodeURIComponent(sanatci + " " + sarki);
        window.open("https://www.youtube.com/results?search_query=" + query, "_blank");
      }
    }
  </script>
</body>
</html>
