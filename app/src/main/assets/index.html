<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NK Music Box</title>
  <style>
    :root {
      --bg: #121216;
      --card: #1e1e24;
      --accent: #9D4EDD;
      --accent-gold: #FFB703;
      --text: #ffffff;
      --subtext: #a0a0ab;
      --border: #2a2a35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; padding-bottom: 80px; }
    
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .header-logo { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, #7B2CBF, #9D4EDD); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header h1 { font-size: 22px; font-weight: 800; font-family: Georgia, serif; }
    .subtitle { font-size: 13px; color: var(--subtext); margin-bottom: 16px; }

    .group-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .group-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: 0.2s; }
    .group-card.active { border-color: var(--accent-gold); background: #25232d; }
    .group-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .group-desc { font-size: 11px; color: var(--subtext); }

    .search-box { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; }

    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .song-info { display: flex; flex-direction: column; gap: 2px; }
    .song-title { font-weight: 700; font-size: 15px; }
    .song-artist { font-size: 12px; color: var(--subtext); }
    .song-year { font-size: 11px; color: var(--accent-gold); }

    .song-actions { display: flex; align-items: center; gap: 6px; }
    .btn-dinle {
      background: linear-gradient(135deg, #9D4EDD, #FFB703);
      color: #121212;
      font-weight: bold;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-sec { background: #2a2a35; border: none; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">📻</div>
    <h1>NK music box</h1>
  </div>
  <p class="subtitle">Senin 4 grubun, senin listelerin. Şarkıya dokun, anında dinle.</p>

  <div class="group-grid">
    <div class="group-card active" onclick="selectCategory('yerli_pop', this)">
      <div class="group-title">1. Yerli Pop</div>
      <div class="group-desc">80'ler · 90'lar · günümüz</div>
    </div>
    <div class="group-card" onclick="selectCategory('yabanci_pop', this)">
      <div class="group-title">2. Yabancı Pop</div>
      <div class="group-desc">80'ler · 90'lar · günümüz</div>
    </div>
    <div class="group-card" onclick="selectCategory('kafa_sarkilar', this)">
      <div class="group-title">3. Kafa Şarkılar</div>
      <div class="group-desc">Sanat müziği · 45'likler · taş plak</div>
    </div>
    <div class="group-card" onclick="selectCategory('dinlemelik', this)">
      <div class="group-title">4. Dinlemelik</div>
      <div class="group-desc">Afro · blues · caz</div>
    </div>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="Tüm gruplarda ara: sanatçı veya şarkı" oninput="searchSongs()">

  <div class="song-list" id="songContainer">
    <div style="text-align:center; padding: 20px; color: #aaa;">Listeler yükleniyor...</div>
  </div>

  <script>
    let jsonData = null;
    let currentKey = 'yerli_pop';

    // JSON Verisini Oku (muzik_dolabi.json)
    fetch('muzik_dolabi.json')
      .then(response => response.json())
      .then(data => {
        jsonData = data;
        renderCategory(currentKey);
      })
      .catch(err => {
        console.error('JSON okunamadı:', err);
        document.getElementById('songContainer').innerHTML = '<div style="color:red; text-align:center;">muzik_dolabi.json yüklenemedi!</div>';
      });

    function selectCategory(key, el) {
      currentKey = key;
      document.querySelectorAll(".group-card").forEach(c => c.classList.remove("active"));
      if(el) el.classList.add("active");
      renderCategory(key);
    }

    function renderCategory(key) {
      if (!jsonData || !jsonData.sekmeler || !jsonData.sekmeler[key]) {
        document.getElementById("songContainer").innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Bu kategoride henüz şarkı yok.</div>';
        return;
      }

      const songList = [];
      const items = jsonData.sekmeler[key];

      items.forEach(item => {
        if (item.sarkilar && Array.isArray(item.sarkilar)) {
          item.sarkilar.forEach(s => {
            songList.push({
              ad: s.ad,
              sanatci: s.sanatci,
              yil: item.yil || ""
            });
          });
        }
      });

      renderSongs(songList);
    }

    function renderSongs(songs) {
      const container = document.getElementById("songContainer");
      container.innerHTML = "";

      if (songs.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Sonuç bulunamadı.</div>';
        return;
      }

      songs.forEach(song => {
        const card = document.createElement("div");
        card.className = "song-card";
        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${song.ad}</div>
            <div class="song-artist">${song.sanatci} ${song.yil ? `<span class="song-year">(${song.yil})</span>` : ''}</div>
          </div>
          <div class="song-actions">
            <button class="btn-dinle" onclick="sarkiCal('${song.sanatci}', '${song.ad}')">▶ DİNLE</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchSongs() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      if (!q) {
        renderCategory(currentKey);
        return;
      }

      if (!jsonData || !jsonData.sekmeler) return;

      const results = [];
      Object.keys(jsonData.sekmeler).forEach(key => {
        jsonData.sekmeler[key].forEach(item => {
          if (item.sarkilar) {
            item.sarkilar.forEach(s => {
              if (s.ad.toLowerCase().includes(q) || s.sanatci.toLowerCase().includes(q)) {
                results.push({ ad: s.ad, sanatci: s.sanatci, yil: item.yil || "" });
              }
            });
          }
        });
      });

      renderSongs(results);
    }

    function sarkiCal(sanatci, sarki) {
      if (window.AndroidInterface && window.AndroidInterface.playSong) {
        window.AndroidInterface.playSong(sanatci, sarki, "", "");
      } else {
        const query = encodeURIComponent(sanatci + " " + sarki);
        window.open("https://www.youtube.com/results?search_query=" + query, "_blank");
      }
    }
  </script>
</body>
</html>
